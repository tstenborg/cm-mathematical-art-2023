<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Apollonian Sunset</title>
    <style>
      /* Set responsive figure width scaling and caption text alignment. */
      /* Figure margins...                                               */
      /*     Top and bottom: 20 pixels.                                  */
      /*     Left and right: equally split available screen space.       */
      figure {
        margin: 20px auto;
        max-width: 100%;
        text-align: center;
      }

      /* Responsive, proportional, image height and width scaling. */
      img {
        height: auto;
        max-width: 100%;
      }

      /* Include some vertical space between the image and caption text. */
      figcaption {
        margin-top: 8px;
      }
    </style>
  </head>
  <body>
    <figure>
      <img
        src="../assets/apollonian-sunset-web.png"
        alt="A retro sunset with magenta stripes and halo, overlaid with a similar-sized black Apollonian gasket, on a space background."
        width="1200"
      />
      <figcaption>
        <i>Apollonian Sunset</i> merges a fractal Apollonian gasket with a
        synthwave sunset (retrosun). Artwork by Travis Stenborg, licensed under
        <a href="https://creativecommons.org/licenses/by-sa/4.0/legalcode.en"
          >CC BY-SA 4.0</a
        >. Source:
        <a href="https://github.com/tstenborg/cm-mathematical-art-2023"
          >CARMA-MATRIX Mathematical Art 2023</a
        >.
      </figcaption>
    </figure>
  </body>
</html>
